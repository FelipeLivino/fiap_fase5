name: cardioia

services:
  cardioia-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardioia-mvp:local
    env_file:
      - .env
    secrets:
      - watson_api_key
    ports:
      - "127.0.0.1:${CARDIOIA_HOST_PORT:-5000}:5000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  cardioia-test:
    image: cardioia-mvp:local
    profiles:
      - test
    command:
      - python
      - tests/run_tests.py
    environment:
      SMOKE_BASE_URL: http://cardioia-app:5000
    depends_on:
      cardioia-app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  genai-test:
    build:
      context: .
      dockerfile: Dockerfile.genai
    image: cardioia-genai:local
    profiles:
      - genai
    command:
      - python
      - -m
      - genai.test_genai
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  genai-live:
    build:
      context: .
      dockerfile: Dockerfile.genai
    image: cardioia-genai:local
    profiles:
      - genai-live
    command:
      - python
      - -m
      - genai.cli
      - --mode
      - gemini
      - --input-file
      - genai/examples/entrada-01.txt
    environment:
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GEMINI_MODEL: gemini-3.5-flash-lite
    secrets:
      - gemini_api_key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  video-assets:
    build:
      context: .
      dockerfile: Dockerfile.video
    image: cardioia-video:local
    profiles:
      - video
    entrypoint:
      - python3
    command:
      - /tools/generate_video_assets.py
    environment:
      VIDEO_FRAMES_DIR: /work/output/frames
    volumes:
      - ./output/video:/work/output
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  video-render:
    build:
      context: .
      dockerfile: Dockerfile.video
    image: cardioia-video:local
    profiles:
      - video
    command:
      - -y
      - -f
      - concat
      - -safe
      - "0"
      - -i
      - video/sequence.txt
      - -vf
      - scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:color=white,fps=30,format=yuv420p
      - -c:v
      - libx264
      - -preset
      - medium
      - -crf
      - "20"
      - -movflags
      - +faststart
      - output/cardioia-demonstracao.mp4
    volumes:
      - ./video:/work/video:ro
      - ./output/video:/work/output
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rpa-postgres:
    image: postgres:17-alpine
    profiles:
      - rpa
    environment:
      POSTGRES_DB: cardioia
      POSTGRES_USER: cardioia_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_root_password
    secrets:
      - postgres_root_password
      - rpa_postgres_password
    volumes:
      - rpa-postgres-data:/var/lib/postgresql/data
      - ./rpa/postgres/init.sh:/docker-entrypoint-initdb.d/10-cardioia.sh:ro
    networks:
      - rpa-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cardioia_owner -d cardioia
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rpa-mongo:
    image: mongo:8.0-noble
    profiles:
      - rpa
    environment:
      MONGO_INITDB_ROOT_USERNAME: cardioia_owner
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: cardioia
    secrets:
      - mongo_root_password
      - rpa_mongo_password
    volumes:
      - rpa-mongo-data:/data/db
      - ./rpa/mongo/init.js:/docker-entrypoint-initdb.d/10-cardioia.js:ro
    networks:
      - rpa-internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username cardioia_owner
          --password "$$(cat /run/secrets/mongo_root_password)"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rpa-worker:
    build:
      context: .
      dockerfile: Dockerfile.rpa
    image: cardioia-rpa:local
    profiles:
      - rpa
    environment:
      POSTGRES_HOST: rpa-postgres
      POSTGRES_DB: cardioia
      RPA_POSTGRES_USER: cardioia_rpa
      RPA_POSTGRES_PASSWORD_FILE: /run/secrets/rpa_postgres_password
      MONGO_HOST: rpa-mongo
      RPA_MONGO_USER: cardioia_rpa
      RPA_MONGO_PASSWORD_FILE: /run/secrets/rpa_mongo_password
      RPA_MAX_CYCLES: 2
      RPA_INTERVAL_SECONDS: 2
    secrets:
      - rpa_postgres_password
      - rpa_mongo_password
    depends_on:
      rpa-postgres:
        condition: service_healthy
      rpa-mongo:
        condition: service_healthy
    networks:
      - rpa-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  rpa-test:
    image: cardioia-rpa:local
    profiles:
      - rpa
    command:
      - python
      - -m
      - rpa.test_rpa
    environment:
      RPA_POSTGRES_PASSWORD_FILE: /run/secrets/rpa_postgres_password
      RPA_MONGO_PASSWORD_FILE: /run/secrets/rpa_mongo_password
    secrets:
      - rpa_postgres_password
      - rpa_mongo_password
    depends_on:
      rpa-worker:
        condition: service_completed_successfully
    networks:
      - rpa-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  watson_api_key:
    file: ./.secrets/watson_api_key
  gemini_api_key:
    file: ./.secrets/gemini_api_key
  postgres_root_password:
    file: ./.secrets/postgres_root_password
  rpa_postgres_password:
    file: ./.secrets/rpa_postgres_password
  mongo_root_password:
    file: ./.secrets/mongo_root_password
  rpa_mongo_password:
    file: ./.secrets/rpa_mongo_password

networks:
  rpa-internal:
    internal: true

volumes:
  rpa-postgres-data:
  rpa-mongo-data:
